name: Windows application

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install --requirement requirements_windows.txt
      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

  build:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build packaged application
        shell: pwsh
        run: .\tools\build_windows.ps1
      - name: Run packaged self-test
        shell: pwsh
        run: |
          & .\dist\AutoZoomLeaver.exe --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged self-test failed with exit code $LASTEXITCODE"
          }
      - name: Upload packaged executable
        uses: actions/upload-artifact@v4
        with:
          name: AutoZoomLeaver-windows
          path: dist/AutoZoomLeaver.exe
          if-no-files-found: error
