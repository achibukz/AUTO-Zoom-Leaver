name: Windows Zoom diagnostic

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest tests/test_windows_zoom_diagnostic.py

  build:
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install diagnostic dependencies
        shell: pwsh
        run: python -m pip install -r requirements_windows_diagnostic.txt
      - name: Run unit tests
        shell: pwsh
        run: python -m pytest tests/test_windows_zoom_diagnostic.py
      - name: Build diagnostic executable
        shell: pwsh
        run: pyinstaller --clean --noconfirm tools/windows_zoom_diagnostic.spec
      - name: Verify artifact
        shell: pwsh
        run: |
          $artifact = "dist\AutoZoomLeaverDiagnostic.exe"
          if (-not (Test-Path $artifact)) {
            throw "Expected diagnostic executable was not created: $artifact"
          }
      - name: Upload diagnostic executable
        uses: actions/upload-artifact@v4
        with:
          name: AutoZoomLeaverDiagnostic-windows
          path: dist/AutoZoomLeaverDiagnostic.exe
          if-no-files-found: error
